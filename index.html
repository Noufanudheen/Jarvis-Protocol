<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>The JARVIS Protocol — Rider &amp; Merc</title>
    <meta name="description" content="A cinematic holographic intelligence system. Enter the JARVIS Protocol.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Bangers&family=Metal+Mania&family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
    </script>
    <script type="module" src="js/main.js"></script>
</head>

<body>

    <!-- Overlays -->
    <div id="scanline-overlay"></div>
    <div id="vignette"></div>
    <div id="heartbeat-pulse"></div>
    <canvas id="snap-canvas"></canvas>

    <!-- HUD -->
    <div id="ui-layer">
        <div class="hud-top">
            <span class="hud-title">JARVIS PROTOCOL</span>
            <span class="hud-status" id="hud-status">SYSTEM ONLINE</span>
        </div>
        <div class="hud-top-right">
            <button class="hud-btn" id="btn-voice">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 1a4 4 0 0 0-4 4v7a4 4 0 0 0 8 0V5a4 4 0 0 0-4-4z" />
                    <path d="M19 10v2a7 7 0 0 1-14 0v-2" />
                    <line x1="12" y1="19" x2="12" y2="23" />
                    <line x1="8" y1="23" x2="16" y2="23" />
                </svg>
                VOICE
            </button>
            <button class="hud-btn" id="btn-theme">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10" />
                    <polyline points="12 6 12 12 16 14" />
                </svg>
                TIMELINE
            </button>
        </div>
        <div class="hud-bottom">⟨ SCROLL TO NAVIGATE · CLICK NODE ⟩</div>
    </div>

    <!-- Nav Panel -->
    <div id="nav-panel">
        <button id="nav-0" class="nav-btn" title="Reality Stone">🔴</button>
        <button id="nav-1" class="nav-btn" title="Power Stone">🟣</button>
        <button id="nav-2" class="nav-btn" title="Time Stone">🟢</button>
        <button id="nav-3" class="nav-btn" title="Space Stone">🔵</button>
        <button id="nav-4" class="nav-btn" title="Mind Stone">🟡</button>
        <button id="nav-5" class="nav-btn" title="Soul Stone">🧡</button>
        <div style="height:8px;"></div>
        <button id="nav-reset" class="nav-btn reset-btn" title="Reset View">✕</button>
    </div>

    <!-- Voice Indicator -->
    <div id="voice-indicator" class="hidden">
        <div class="voice-ring"></div>
        <span>LISTENING...</span>
    </div>
</body>

</html>
